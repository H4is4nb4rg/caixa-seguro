name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Back-end (testes e cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes unitários e de integração com cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Auditoria de dependências
        run: pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    name: Front-end (build de produção)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npx ng build

      - name: Auditoria de dependências
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
